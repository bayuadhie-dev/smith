name: CI

# Pemeriksaan yang MEMBLOKIR: kalau backend atau frontend gagal, commit ditandai merah.
# Deploy tetap manual lewat scripts/deploy.sh (lihat skrip itu).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend-test:
    name: Backend tests (semua)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Library sistem (WeasyPrint untuk cetak dokumen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan semua tes
        working-directory: backend
        env:
          FLASK_ENV: development
          SECRET_KEY: ci-secret-key
          JWT_SECRET_KEY: ci-jwt-secret-key
        # Tanpa Redis (sama seperti lokal): cache Redis membuat hasil antar tes saling terbawa.
        run: pytest tests -q -p no:cacheprovider --maxfail=25 --cov=. --cov-report=xml

      - name: Upload coverage ke Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (type-check, tes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Tes
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  migrations:
    name: Migrasi punya satu head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Library sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pastikan hanya ada satu head migrasi
        working-directory: backend
        env:
          FLASK_APP: app.py
          FLASK_ENV: development
          SECRET_KEY: ci-secret-key
          JWT_SECRET_KEY: ci-jwt-secret-key
        run: |
          heads=$(flask db heads 2>/dev/null | grep -c "(head)" || true)
          echo "Jumlah head: $heads"
          [ "$heads" = "1" ] || { echo "Migrasi bercabang (lebih dari satu head). Gabungkan dengan 'flask db merge'."; flask db heads; exit 1; }
