<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Onest untuk antarmuka, JetBrains Mono untuk angka/kode/label kecil.
         Kalau jaringan ke Google mati, browser jatuh ke Inter / font sistem. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>ERP System</title>
    <script>
      (function () {
        try {
          var t = /fsnindonesia/i.test(location.hostname) ? 'fengsheng' : localStorage.getItem('company_theme');
          if (t) document.documentElement.setAttribute('data-company', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
